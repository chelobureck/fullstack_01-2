<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кафе Утро</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,400..700;1,400..700&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="container_header">
            <a href="#" class="logo">
                <img src="images/logo.svg" alt="logo_cafe_utro">
            </a>
            <nav>
                <ul>
                    <li><a href="">Главная</a></li>
                    <li><a href="">Меню</a></li>
                    <li><a href="">О нас</a></li>
                    <li><a href="">Контакты</a></li>
                </ul>
            </nav>
            <input type="button" value="Забронировать стол">
        </div>
    </header>
    <main>
        <div class="container_main">
            <section class="main_section">
                <div class="main_content">
                    <h1>Вкусные <br> завтраки каждый <br> день</h1>
                    <p>Ароматный кофе свежая выпечка <br> и уютная атмосфера.</p>
                    <input type="button" value="Забронировать стол">
                </div>
            </section>
            <section class="blok_container">
                <div class="blok">
                    <img src="images/icon-1.svg" alt="">
                    <div class="blok_text">
                        <h3>Свежий кофе</h3>
                        <p>Лучшие зерна <br> каждый день.</p>
                    </div>
                </div>
                <div class="blok">
                    <img src="images/icon-2.svg" alt="">
                    <div class="blok_text">
                        <h3>Свежая выпечка</h3>
                        <p>Ароматные круассаны <br> и десерты.</p>
                    </div>
                </div>
                <div class="blok">
                    <img src="images/icon-3.svg" alt="">
                    <div class="blok_text">
                        <h3>Уютное место</h3>
                        <p>Идеально для работы <br> и встреч.</p>
                    </div>
                </div>
            </section>
        </div>
    </main>
</body>
</html>
