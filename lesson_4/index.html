<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main>
        <div class="content">
            <div class="footer">
                <h1 class="title">Frontend Meetup</h1>
                <p>Первое мероприятие для начинающих Frontend-разработчиков</p>
            </div>
            <div class="image_event">
                <img src="media/example.png" alt="meetup_img">
            </div>
            <section>
                <h2>Что будет на встрече</h2>
                <ul>
                    <li>HTML</li>
                    <li>CSS</li>
                    <li>Практика</li>
                </ul>
                <h2>Записаться на мероприятие</h2>
                <form action="post" class="sign_up">
                    <div class="text_input">
                        <label for="">
                            Имя:  
                            <input type="text" required>
                        </label>
                    </div>
                    <div class="text_input">
                        <label for="">
                            Email:
                            <input type="email" name="" id="" required>
                        </label>
                    </div>
                    <div class="button">
                        <input type="button" value="Записаться">
                    </div>
                </form>
            </section>
        </div>
    </main>
</body>
</html>
